<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainSmart">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TrainSmart Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one narrow logbook column. Big condensed numerals, and plate yellow reserved for the single next action. */
  --ink:#0d1b24;
  --panel:#14262f;
  --line:#274350;
  --chalk:#eef1ea;
  --mute:#8fa4ad;
  --plate:#f3c13a;
  --plate-ink:#241b00;
  --good:#5dd39e;
  --warn:#ff9d4d;
  --bad:#ff6b6b;
  --font-display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font:400 16px/1.45 var(--font-body);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);overflow:hidden}
@media(min-width:520px){body{background:#08121a}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand::before{content:'';width:4px;height:20px;border-radius:2px;background:var(--plate);flex:none}
.wordmark{font:800 21px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark span{color:var(--mute);font-weight:600}
.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font:700 14px/1 var(--font-body);color:var(--chalk)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font:600 12px/1.2 var(--font-body);color:var(--mute);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(93,211,158,.45)}
.pill.warn{color:var(--warn);border-color:rgba(255,157,77,.5)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 32px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:16px}

nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(20,38,47,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--mute);font:600 11px/1 var(--font-body);letter-spacing:.02em;transition:color .15s}
nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--plate)}

.eyebrow{font:700 11px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.h1{font:800 40px/.95 var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.h2{font:800 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.title{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.title .meta{font-size:14px}
.meta{color:var(--mute);font-size:14px}
.hint{color:var(--mute);font-size:13px;line-height:1.45}
.num{font:800 34px/1 var(--font-display);letter-spacing:.01em}
.num small{font:600 13px/1 var(--font-body);color:var(--mute);margin-left:4px;letter-spacing:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.next{background:var(--plate);border-color:var(--plate);color:var(--plate-ink);gap:14px}
.card.next .eyebrow,.card.next .meta,.card.next .hint{color:rgba(36,27,0,.7)}
.card.next .h1{font-size:56px}
.card.quiet{background:var(--panel);border-color:var(--line);color:var(--chalk)}
.card.quiet .eyebrow,.card.quiet .meta{color:var(--mute)}
.card.quiet .h1{font-size:34px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 14px/1.2 var(--font-body)}
.facts span{display:inline-flex;align-items:center;gap:6px}
.facts span+span::before{content:'';width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;margin-right:8px}
.blk{display:flex;flex-direction:column;gap:7px}
.blk .row{font:600 12px/1 var(--font-body);letter-spacing:.04em}
.blk .track{height:4px;border-radius:2px;background:rgba(36,27,0,.16);overflow:hidden}
.blk .track i{display:block;height:100%;background:var(--plate-ink);border-radius:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:0;border-radius:12px;font:700 16px/1 var(--font-body);cursor:pointer;transition:transform .12s ease,opacity .12s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--plate);color:var(--plate-ink)}
.btn.dark{background:var(--ink);color:var(--chalk)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.btn.block{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .num{font-size:28px}
.tile .sub{font-size:12px;color:var(--mute);line-height:1.2}
.tile .sub.ok{color:var(--good)}

/* targets: one card, hairline columns */
.macros4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.macros4>div{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-left:1px solid var(--line);min-width:0}
.macros4>div:first-child{border-left:0}
.macros4 .num{font-size:28px}
.macros4 .u{font:500 12px/1 var(--font-body);color:var(--mute)}
.macros4 .sub{font:600 11px/1.2 var(--font-body);color:var(--good)}
.macros4+.strip{margin-top:-8px}
.strip{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;font-size:14px}
.strip b{font:800 22px/1 var(--font-display);letter-spacing:.02em}
.strip .meta{font-size:13px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border-radius:12px;font:600 11px/1 var(--font-body);color:var(--mute);letter-spacing:.02em}
.day b{font:800 20px/1 var(--font-display);color:var(--chalk)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day.done .dot{background:var(--good)}
.day.missed .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.day.today{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--plate)}
.day.today>span{color:var(--plate)}

.bar{height:8px;border-radius:99px;background:var(--ink);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar>i.load{width:35%;background:var(--plate);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}

/* forms */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--ink);color:var(--mute);font:600 14px/1 var(--font-body);cursor:pointer}
.chip.on{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.fl{font:600 13px/1.2 var(--font-body);color:var(--mute)}
.fl i{font-style:normal;font-weight:400;opacity:.8}
.inwrap{position:relative;display:block}
.inwrap input,.field textarea,.date input{width:100%;min-height:48px;padding:0 12px;background:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:16px;color:var(--chalk)}
.inwrap em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:500 12px/1 var(--font-body);color:var(--mute);font-style:normal;pointer-events:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inwrap input{padding-right:78px}
.field textarea{padding:12px;min-height:96px;resize:vertical;line-height:1.4}
.inwrap input.bad,.field textarea.bad{border-color:var(--bad)}
.ferr,.err{font-size:12px;color:var(--bad);min-height:0}
.ferr:empty,.err:empty{display:none}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--mute);font:600 14px/1 var(--font-body);cursor:pointer;padding:0}
.scale button.on{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.banner.ok{border-color:rgba(93,211,158,.5)}
.banner.ok b{color:var(--good)}
.banner.warn{border-color:rgba(255,157,77,.55)}
.banner.warn b{color:var(--warn)}
.banner ul{margin:6px 0 0 18px}
.datechip{position:relative;display:inline-flex;align-items:center;gap:7px;overflow:hidden}
.datechip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.datechip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.datechip input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip .ct{font-weight:500;opacity:.6}
details.coach{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
details.coach summary{cursor:pointer;list-style:none;font-weight:600}
details.coach summary::-webkit-details-marker{display:none}
details.coach div{margin-top:6px}
.hr{height:1px;background:var(--line);border:0}

/* train */
.ex{gap:10px}
.ex.done{border-color:rgba(93,211,158,.55)}
.ex-head{display:flex;align-items:center;gap:10px}
.ex-n{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);border:1px solid var(--line);font:800 16px/1 var(--font-display);color:var(--plate);flex:none}
.ex.done .ex-n{background:var(--good);border-color:var(--good);color:#06281a}
.ex-head h2{font:700 17px/1.2 var(--font-body);flex:1;min-width:0}
.demo{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 12px/1 var(--font-body);cursor:pointer}
.demo svg{width:10px;height:10px;fill:currentColor}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:7px;background:var(--ink);border:1px solid var(--line);font:600 12px/1 var(--font-body);color:var(--mute)}
.tag b{color:var(--chalk);font-weight:600;margin-left:4px}
.tl{display:grid;gap:4px}
.tl>div{display:flex;gap:10px;align-items:baseline}
.tl dt{width:46px;flex:none;font:700 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tl dd{font:600 15px/1.3 var(--font-body)}
.tl .tgt dd{color:var(--plate)}
.ex-meta{font-size:13px;color:var(--mute)}
.ex-note{font-size:13px;color:var(--chalk);opacity:.85;border-left:2px solid var(--line);padding-left:10px}
.sets{display:grid;grid-template-columns:repeat(var(--n),1fr) 1.25fr;gap:8px}
.sets.wrap{grid-template-columns:repeat(var(--c),1fr);row-gap:12px}
.setf{display:flex;flex-direction:column;gap:5px;min-width:0}
.setf span{font:600 11px/1.1 var(--font-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setf input{width:100%;min-height:50px;padding:0 6px;text-align:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;font:700 20px/1 var(--font-body);color:var(--chalk)}
.setf input.bad{border-color:var(--bad)}
.setf input::placeholder{font:500 12px var(--font-body);color:var(--mute)}
.fb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb .chip{min-height:34px;padding:0 12px;font-size:13px}
.rowstate{margin-left:auto;font:700 12px/1 var(--font-body);color:var(--good)}
.dock{position:sticky;bottom:-28px;margin:0 -16px -28px;padding:12px 16px calc(14px + 0px);background:linear-gradient(to top,var(--ink) 72%,rgba(13,27,36,0));display:flex;flex-direction:column;gap:8px}
.dock .row{font-size:14px;color:var(--mute)}

.pips{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.pip{height:10px;border-radius:99px;background:var(--ink);border:1px solid var(--line)}
.pip.on{background:var(--good);border-color:var(--good)}
.card.next .pill{color:var(--plate-ink);border-color:rgba(36,27,0,.5);font-weight:700}
.day .trs{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 3px}
.day .tr{display:block;text-align:center;padding:4px 0;border-radius:6px;background:var(--good);color:#06281a;font:800 10px/1 var(--font-body);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.day .tr.none{background:transparent}
.day.trained{border-color:rgba(93,211,158,.65)}
.day.today.trained{border-color:var(--plate)}
.hy{padding:0;gap:0;overflow:hidden}
.hy-row{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line)}
.hy-row:first-child{border-top:0}
.hy-row.done{background:rgba(93,211,158,.07)}
.hy-main{display:flex;align-items:center;gap:10px}
.hy-tag{flex:none;width:58px;text-align:center;padding:5px 0;border-radius:6px;border:1px solid var(--line);font:700 10px/1 var(--font-body);letter-spacing:.1em;color:var(--mute)}
.hy-row.stn .hy-tag{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}
.hy-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hy-name b{font:700 16px/1.2 var(--font-body)}
.hy-name span{font-size:13px;color:var(--mute)}
.hy-time{flex:none;width:92px}
.hy-time input{width:100%;min-height:50px;text-align:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;font:700 22px/1 var(--font-body);color:var(--chalk)}
.hy-time input::placeholder{font:500 13px var(--font-body);color:var(--mute)}
.hy-time input.bad{border-color:var(--bad)}
.hy-time input.warn{border-color:var(--warn)}
.hy-sub{font-size:13px;color:var(--mute);margin-left:68px}
.hy-sub b{color:var(--plate);font-weight:700}
.hy-note{margin-left:68px}
.hy-sub2{display:flex;align-items:flex-end;gap:10px;margin-left:68px}
.hy-load{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.hy-load span{font:600 11px/1.1 var(--font-body);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hy-load input{width:100%;min-height:44px;padding:0 8px;text-align:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;font:700 18px/1 var(--font-body);color:var(--chalk)}
.hy-load input.bad{border-color:var(--bad)}
.hy-row .err{margin-left:68px}
.hy-warn{font-size:12px;color:var(--warn);margin-left:68px}
.hy-warn:empty{display:none}

/* chart */
.chart{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:700 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:left;padding:0 0 8px}
td{padding:9px 0;border-top:1px solid var(--line)}
th:not(:first-child),td:not(:first-child){text-align:right}
.up{color:var(--warn)} .down{color:var(--good)}
.gain{color:var(--good)}
.liftpick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.liftpick::-webkit-scrollbar{display:none}
.liftpick .chip{flex:none;min-height:34px;font-size:13px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{display:flex;flex-direction:column;gap:6px;font:600 12px/1 var(--font-body);color:var(--mute);cursor:pointer;text-align:center}
.ph-box{display:grid;place-items:center;aspect-ratio:3/4;border-radius:12px;border:1px dashed var(--line);background:var(--ink) center/cover no-repeat;font:800 30px/1 var(--font-display);color:var(--mute)}
.ph-box.has{border-style:solid;border-color:var(--good);color:transparent}

/* coach mode */
.coachbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 20px 6px;padding:8px 8px 8px 14px;border:1px solid var(--plate);border-radius:12px;background:rgba(243,193,58,.08);font-size:14px}
.coachbar .btn{padding:7px 12px;font-size:13px;min-height:0}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--chalk);font:inherit;cursor:pointer}
.crow b{font-size:16px}
.crow .meta{display:block;font-size:12px;margin-top:3px}
.crow .st{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap;background:rgba(143,164,173,.15);color:var(--mute)}
.crow .st.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.crow .st.warn{background:rgba(255,157,77,.15);color:var(--warn)}
.crow .st.good{background:rgba(93,211,158,.15);color:var(--good)}
.crow .st.new{background:rgba(243,193,58,.15);color:var(--plate)}
.csearch{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font:inherit;font-size:16px}
.recent{display:flex;gap:8px;flex-wrap:wrap}
/* personal bests + coach feedback */
.pbs{gap:0}
.pbrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pbrow:last-of-type{border-bottom:0}
.pbrow>div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.pbrow .meta{font-size:12px}
.pbv{font:700 20px/1 var(--font-body);color:var(--plate);white-space:nowrap}
.pbv .meta{font-weight:600;font-size:13px}
.coachfb{border-color:var(--plate)}
.fbtext{white-space:pre-wrap;line-height:1.45}
/* meals */
.meal{display:flex;flex-direction:column;gap:10px}
.meal h3{font:700 19px/1.2 var(--font-body)}
.macros{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:600 14px/1.2 var(--font-body);color:var(--mute)}
.macros b{font:800 30px/1 var(--font-display);color:var(--plate);letter-spacing:.01em}
.macros .mx{color:var(--chalk);font-weight:600}
.macros .mx:first-of-type{margin-left:6px}
.macros .mx i{font-style:normal;color:var(--mute);font-weight:600;margin-right:3px}
details.amts{border-top:1px solid var(--line);padding-top:10px}

details.amts summary::-webkit-details-marker{display:none}
details.amts summary::after{content:'+';color:var(--mute);font-size:20px}
details.amts[open] summary::after{content:'\2212'}
details.amts ul{margin-top:8px;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:15px}

.wkrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wkrow:first-of-type{border-top:0}
.wkrow span:last-child{color:var(--mute);text-align:right}

.ptns{display:flex;gap:6px}
.ptn{flex:1;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--mute);font:600 13px/1 var(--font-body);cursor:pointer}
.ptn.on{background:var(--plate);border-color:var(--plate);color:var(--plate-ink)}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

.sum b{font-size:15px}
.sum .nx{color:var(--plate);font-weight:600;font-size:14px}
.sum .why{font-size:13px;color:var(--mute)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:40;background:var(--chalk);color:var(--ink);padding:11px 16px;border-radius:12px;font:600 14px/1.3 var(--font-body);max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media(prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

function weeklyRows(){

  var prev=null;
  return Object.keys(map).map(Number).sort(function(a,b){return a-b;}).map(function(w){
    var a=avg(map[w]);var row={week:w,avg:a,change:prev==null?null:a-prev,logged:map[w].length};prev=a;return row;});
}
function thisWeekLogs(){

function sessionsThisWeek(){return state.history.filter(function(h){return weekOf(fromIso(h.date))===THIS_WEEK;}).length;}
function carriedOver(){
  var done=sessionsThisWeek();
  var owed=Math.max(0,(THIS_WEEK-1)*CFG.plannedPerWeek-(completed-done));
  return Math.max(0,owed-done);
}
function sessionOn(d){var h=state.history.filter(function(x){return x.date===d;});return h.length?h[h.length-1].name:null;}
function isHy(x){return !!x&&x.type==='hyrox';}
function shortOf(name){var x=SESSIONS.filter(function(q){return q.name===name;})[0];return x?(x.short||x.name):name;}
function wkCount(){return Math.min(sessionsThisWeek(),CFG.plannedPerWeek)+' of '+CFG.plannedPerWeek+' this week';}
function weekChips(){var c=carriedOver();return '<div class="chips"><span class="pill">'+wkCount()+'</span>'+(c>0?'<span class="pill warn">'+c+' carried over</span>':'')+'</div>';}
function doneMsg(name){return finished()?name+' saved. Block complete.':name+' saved · '+wkCount();}
function sessFacts(x,noTarget){

  else{f=[x.ex.length+' exercises',x.ex.reduce(function(a,e){return a+e.sets;},0)+' sets'];}

}
var LDAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var LMONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function sessMeta(x){

function previewBanner(){return LIVE?'<div class="banner warn"><div><b>Preview only.</b> Nothing on this screen is saved yet.</div></div>':'';}
/* Names typed in caps in the sheet ("BACK SQUAT") show as "Back Squat". Mixed-case names are left as typed. */
var ABBR=/\b(Db|Kb|Bb|Ez|Rdl|Sldl|Sl|Ssb|Trx|Amrap|Emom|Hiit|Ohp|Rfess?|Ghr|Ski|Bw)\b/g;
function nice(v){
  var s=String(v||'').trim();
  if(s!==s.toUpperCase()){return s;}
  return s.toLowerCase().replace(/(^|[\s\-\/(])(\S)/g,function(m,a,b){return a+b.toUpperCase();}).replace(ABBR,function(m){return m==='Ski'?m:m.toUpperCase();});
}
function outcomeText(o){
  var s=String(o||'').toUpperCase();
  if(/PROGRESS/.test(s)&&/LOAD|WEIGHT/.test(s)){return 'Load goes up next time';}
  if(/PROGRESS/.test(s)&&/REP/.test(s)){return 'Reps go up next time';}
  if(/^REPEAT|HOLD|SAME/.test(s)){return 'Same targets next time';}
  if(/DELOAD|REDUCE/.test(s)){return 'Load comes down next time';}
  return nice(String(o||'').replace(/\s*[•·]\s*/g,' · '));
}
function dateOf(v){var d=new Date(v);return isNaN(d.getTime())?todayIso:iso(d);}
function getToken(){
  var t='';
  try{t=new URLSearchParams(location.search).get('t')||'';}catch(e){}
  if(t){try{localStorage.setItem('ts_token',t);}catch(e){}return t;}
  try{t=localStorage.getItem('ts_token')||'';}catch(e){}
  return t||CFG.previewToken||'';
}
/* Per-client test switches from the link (&on= / &off=), remembered per client on this device. */
var TABKEYS=['log','train','meals','progress','checkin'],TESTTABS={},CLIENTTABS={};
/* Roster tick-boxes arrive from the sheet as true/false, "TRUE"/"FALSE", "yes"/"no" or blank. Blank = use the default. */
function readClientTabs(raw){
  var out={};if(!raw||typeof raw!=='object'){return out;}
  Object.keys(raw).forEach(function(k){
    var key=String(k).toLowerCase().replace(/[^a-z]/g,''),v=raw[k];
    if(TABKEYS.indexOf(key)<0||v===''||v==null){return;}
    var t=String(v).trim().toLowerCase();
    if(v===true||t==='true'||t==='yes'||t==='on'||t==='1'){out[key]=true;}
    else if(v===false||t==='false'||t==='no'||t==='off'||t==='0'){out[key]=false;}
  });
  return out;
}
function loadTestTabs(){
  var key='ts_tabs_'+TOKEN,q=null,saved=null;
  try{q=new URLSearchParams(location.search);}catch(e){}
  if(q&&(q.has('on')||q.has('off'))){
    var t={};
    function read(name,val){String(q.get(name)||'').toLowerCase().split(/[\s,]+/).forEach(function(k){if(TABKEYS.indexOf(k)>=0){t[k]=val;}});}
    read('on',true);read('off',false);
    try{if(Object.keys(t).length){localStorage.setItem(key,JSON.stringify(t));}else{localStorage.removeItem(key);}}catch(e){}
    TESTTABS=t;return;
  }
  try{saved=JSON.parse(localStorage.getItem(key)||'null');}catch(e){}
  TESTTABS=saved&&typeof saved==='object'?saved:{};
}
function tabOn(t){
  if(t==='home'||!LIVE){return true;}
  if(COACHMODE){return t==='checkin'?CFG.tabs.checkin!==false:true;}
  if(Object.prototype.hasOwnProperty.call(TESTTABS,t)){return !!TESTTABS[t];}
  if(Object.prototype.hasOwnProperty.call(CLIENTTABS,t)){return CLIENTTABS[t];}
  return CFG.tabs[t]!==false;
}
function testing(){return LIVE&&Object.keys(TESTTABS).length>0;}
function firstTab(){return tabOn('train')?'train':'home';}
function apiCall(req,ms){
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){if(ctl){ctl.abort();}},ms||25000);
  var init={},url=CFG.api;
  if(ctl){init.signal=ctl.signal;}
  if(req.action==='home'||req.action==='session'||req.action==='history'){
    url+='?action='+encodeURIComponent(req.action)+'&token='+encodeURIComponent(req.token);
  }else{
    init.method='POST';init.headers={'Content-Type':'text/plain;charset=utf-8'};init.body=JSON.stringify(req);
  }
  return fetch(url,init).then(function(r){return r.text();}).then(function(t){
    clearTimeout(timer);
    try{return JSON.parse(t);}catch(e){throw new Error('Something went wrong on our end. Try again in a minute.');}
  },function(err){
    clearTimeout(timer);
    var x=new Error(err&&err.name==='AbortError'?'This is taking longer than usual. Check your signal and try again.':'Couldn’t connect. Check your signal and try again.');
    x.network=true;throw x;
  });
}
function api(action,extra,ms){
  var req=Object.assign({action:action,token:TOKEN},extra||{});
  return apiCall(req,ms).then(function(j){
    if(!j||!j.ok){var e=new Error((j&&j.message)||'Something went wrong.');e.code=j&&j.error;throw e;}
    return j;
  });
}
function noteFor(exs){var n=(exs||[]).length,p=(exs||[]).filter(function(e){return /^PROGRESS/.test(String(e.outcome||''));}).length;return p+' of '+n+' progressed';}
function liveEx(e){
  return {order:e.order,name:nice(e.name),rawName:e.name,sets:e.sets,lo:e.repLow,hi:e.repHigh,inc:e.increment,rest:e.rest||'',tempo:'',note:e.notes||'',
    live:true,lastText:e.lastText||'',last:{reps:[],load:null,target:[]},
    plan:{target:(e.targetReps||[]).slice(),load:e.targetLoad==null?null:Number(e.targetLoad),kind:'',why:''}};
}
function applyLive(home,sess,hist,nutr){
  nut=nutr&&nutr.ok?nutr:null;nutFail=nutr&&!nutr.ok?nutr:null;
  var st=sess.state||home.state;
  live.state=st;
  live.names=(home.sessionNames||[]).map(nice);
  var fn=nice(String((home.client&&home.client.name)||'').trim().split(/\s+/)[0]);
  CFG.client=fn?fn.charAt(0).toUpperCase()+fn.slice(1):'there';
  CFG.cycles=st.totalCycles||CFG.cycles;CFG.perCycle=st.perCycle||CFG.perCycle;CFG.plannedPerWeek=CFG.perCycle;
  CLIENTTABS=readClientTabs(home.tabs||(home.client&&home.client.tabs));
  completed=st.completedSessions||0;TOTAL=(st.totalCycles||0)*(st.perCycle||0);
  state.history=((hist&&hist.sessions)||[]).slice().reverse().map(function(h){
    return {date:dateOf(h.date),name:nice(h.name),note:noteFor(h.exercises),cycle:h.cycle,session:h.session,exercises:h.exercises||[]};
  });
  var base=state.history.length?fromIso(state.history[0].date):today;
  if(base>today){base=today;}
  startMonday=addDays(base,-dow(base));THIS_WEEK=weekOf(today);
  var key=st.status==='ACTIVE'?st.cycle+'-'+st.session:'';
  live.cur=sess.session?{name:nice(sess.session.name),live:true,ex:(sess.session.exercises||[]).map(liveEx)}:null;
  if(key!==live.key){train.inputs={};live.key=key;}
}
function soft(p){return p.catch(function(e){return {ok:false,error:(e&&e.code)||'error',message:(e&&e.message)||''};});}
function fetchLive(){
  return Promise.all([api('home'),api('session'),api('history'),soft(api('nutrition')),soft(api('logs')),soft(api('pbs')),soft(api('trends'))]).then(function(r){
    applyLive(r[0],r[1],r[2],r[3]);
    var lg=r[4];
    if(lg&&lg.ok){
      LOGLIVE=true;state.logs=lg.logs||{};state.feedback=lg.feedback||{};state.weights={};
      Object.keys(state.logs).forEach(function(k){if(state.logs[k].w!=null){state.weights[k]=state.logs[k].w;}});
    }
    state.pbs=r[5]&&r[5].ok?(r[5].pbs||[]):null;
    state.trends=r[6]&&r[6].ok?r[6]:null;
  });
}
function setPill(){

function bootHtml(){

function wireBoot(){

function sheetError(e,retry){
  var stale=e&&e.code==='stale';
  openSheet('<div class="h2">'+(stale?'Your session has been updated':'That didn’t save')+'</div><div class="meta">'+esc((e&&e.message)||'Something went wrong.')+(e&&e.network?' Your numbers are still here.':'')+'</div>'+
    (stale?'<button class="btn primary block" type="button" id="reloadlive">Reload</button>':'<button class="btn primary block" type="button" id="retry">Try again</button>')+
    '<button class="btn ghost block" type="button" id="backto">Back</button>');
  $('#backto').addEventListener('click',closeSheet);
  var r=$('#retry');if(r){r.addEventListener('click',retry);}
  var rl=$('#reloadlive');if(rl){rl.addEventListener('click',function(){closeSheet();train.inputs={};live.key='';startLive();});}
}
function entriesNow(){
  return curSession().ex.map(function(ex,i){var d=inp(i);return {order:ex.order,name:ex.rawName||ex.name,reps:d.reps.map(Number),load:d.load===''?null:Number(d.load)};});
}
function openLiveSummary(){
  var s=curSession(),entries=entriesNow();
  openSheet('<div class="h2">'+esc(s.name)+'</div><div class="meta">Working out your next targets…</div><div class="bar"><i class="load"></i></div>');
  api('preview',{entries:entries},30000).then(function(j){
    var rows=(j.results||[]).map(function(r,i){
      var d=entries[i]||{reps:[],load:null};
      return '<div class="sum"><b>'+esc(nice(r.name))+'</b><span>Done '+fmtPlan(d.reps,d.load)+'</span><span class="nx">Next '+fmtPlan((r.nextReps||[]).slice(0,r.nextSets),r.nextLoad)+'</span><span class="why">'+esc(r.feedback||outcomeText(r.outcome))+'</span></div>';
    }).join('');
    var nn=nextName();
    openSheet('<div class="h2">Finish '+esc(s.name)+'?</div><div class="meta">Here’s what you did and what’s next. '+(lastOfBlock()?'This finishes your block.':(nn?'Up next: '+esc(nn)+'.':''))+'</div>'+rows+
      '<button class="btn primary block" type="button" id="confirmdone">Save session</button><button class="btn ghost block" type="button" id="backto">Back</button>');
    $('#backto').addEventListener('click',closeSheet);
    $('#confirmdone').addEventListener('click',function(ev){commitLive(ev.currentTarget);});
  },function(e){sheetError(e,openLiveSummary);});
}
function commitLive(btn){
  if(live.busy){return;}
  live.busy=true;
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var s=curSession(),name=s.name,cy=live.state.cycle,se=live.state.session,entries=entriesNow();
  var creq={cycle:cy,session:se,entries:entries,sessionName:name};
  if(COACHMODE){creq.by='coach';creq.coach=COACH;}
  api('complete',creq,60000).then(function(done){
    train.inputs={};
    var pbs=(done&&done.newPbs)||[];
    return fetchLive().then(function(){
      live.busy=false;closeSheet();
      toast(pbs.length?'New PB! '+pbs.map(function(p){return nice(p.exercise)+' '+p.text;}).join(' · '):doneMsg(name));
      route();$('#main').scrollTop=0;
    },function(){
      live.busy=false;closeSheet();BOOT='error';BOOTERR='Your session is saved. Your next one didn’t load, so try again.';route();
    });
  },function(e){live.busy=false;sheetError(e,function(){commitLive(null);});});
}

 {k:'cardio',label:'Cardio',unit:'kcal',step:'1',min:0,max:3000},
 {k:'sleep',label:'Sleep',unit:'hours',step:'0.25',min:0,max:16}
];
var SCALES=[['hunger','Hunger','Not hungry','Starving'],['crave','Cravings','None','Intense'],['sore','Muscle soreness','None','Very sore'],['energy','Energy','Flat','Great'],['stress','Stress','Calm','Maxed'],['sleepq','Sleep quality','Poor','Great']];
function entryFor(d){return drafts[d]||state.logs[d]||{};}
function draftFor(d){if(!drafts[d]){drafts[d]=Object.assign({},state.logs[d]||{});}return drafts[d];}
function numField(f,val){
  return '<label class="field"><span class="fl">'+f.label+'</span><span class="inwrap"><input id="f-'+f.k+'" data-k="'+f.k+'" type="number" inputmode="decimal" step="'+f.step+'" value="'+(val==null?'':esc(val))+'"><em>'+f.unit+'</em></span><span class="ferr" id="e-'+f.k+'"></span></label>';
}
function macroHint(e){
  if(e.p==null||e.f==null||e.c==null){return '';}
  return 'Your macros come to about '+fmt(e.p*4+e.c*4+e.f*9)+' kcal.';
}
function renderLog(){
  var v=$('#view-log');
  var e=entryFor(logDate);
  var yIso=iso(addDays(today,-1));
  var custom=logDate!==todayIso&&logDate!==yIso;
  var sess=sessionOn(logDate);
  var fields={};NUM_FIELDS.forEach(function(f){fields[f.k]=numField(f,e[f.k]);});
  var scales=SCALES.map(function(s){
    var btns='';for(var n=1;n<=7;n++){btns+='<button type="button" data-scale="'+s[0]+'" data-val="'+n+'" class="'+(e[s[0]]===n?'on':'')+'" aria-label="'+s[1]+' '+n+'">'+n+'</button>';}
    return '<div class="field"><span class="fl">'+s[1]+'</span><div class="scale">'+btns+'</div><div class="scale-ends"><span>'+s[2]+'</span><span>'+s[3]+'</span></div></div>';
  }).join('');
  var saved=logSaved===logDate
    ? '<div class="banner ok"><div><b>Saved for '+fmtDate(fromIso(logDate))+'.</b> '+(LIVE&&!LOGLIVE?'Preview only, so it hasn’t been sent.':esc(CFG.coach)+' can see it now.')+'</div></div>' : '';
  var fb=state.feedback[logDate]?'<div class="card coachfb"><div class="eyebrow">Feedback from '+esc(CFG.coach)+'</div><div class="fbtext">'+esc(state.feedback[logDate])+'</div></div>':'';
  v.innerHTML=
    '<div class="title"><div class="eyebrow">Daily log</div><div class="h1">'+(logDate===todayIso?'Today':logDate===yIso?'Yesterday':fmtDate(fromIso(logDate)))+'</div></div>'+
    (LIVE&&!LOGLIVE?previewBanner():'')+saved+fb+
    '<p class="hint">Log as much or as little as you like. Every box is optional.</p>'+
    '<div class="chips" id="datechips"><button class="chip'+(logDate===todayIso?' on':'')+'" type="button" data-date="'+todayIso+'">Today</button><button class="chip'+(logDate===yIso?' on':'')+'" type="button" data-date="'+yIso+'">Yesterday</button>'+
    '<label class="chip datechip'+(custom?' on':'')+'">'+ICON.cal+(custom?fmtDate(fromIso(logDate)):'Other day')+'<input id="pickdate" type="date" min="'+iso(LIVE?addDays(today,-14):startMonday)+'" max="'+todayIso+'" value="'+(custom?logDate:'')+'" aria-label="Pick another date"></label></div>'+
    '<div class="card"><div class="eyebrow">Body and food</div><div class="fgrid">'+fields.w+fields.steps+fields.p+fields.f+fields.c+fields.kcal+'<div class="field wide"><span class="hint" id="macrohint">'+macroHint(e)+'</span></div>'+fields.fluid+'</div></div>'+
    '<div class="card"><div class="eyebrow">Training</div><div class="row"><span class="fl">Session</span><span class="pill'+(sess?' good':'')+'">'+(sess?esc(sess)+' done':'None')+'</span></div><div class="fgrid">'+fields.cardio+'</div></div>'+
    '<div class="card"><div class="eyebrow">How you feel</div>'+scales+'<div class="fgrid">'+fields.sleep+'</div></div>'+
    '<div class="card"><div class="eyebrow">Off plan today?</div><div class="toggle"><button type="button" class="chip'+(e.off===false?' on':'')+'" data-off="0">No</button><button type="button" class="chip'+(e.off===true?' on':'')+'" data-off="1">Yes</button></div>'+
    '<label class="field"><span class="fl">Notes</span><textarea id="f-notes" data-k="notes" placeholder="Meal out, bad night, sore knee… anything worth knowing.">'+esc(e.notes||'')+'</textarea></label></div>'+
    '<div id="warnbox"></div>'+
    '<button class="btn primary block" type="button" id="savelog">'+(state.logs[logDate]?'Update log':'Save log')+'</button>';
  wireLog();
}
function setFieldErr(k,msg){var el=$('#e-'+k),inp=$('#f-'+k);if(el){el.textContent=msg||'';}if(inp){inp.classList.toggle('bad',!!msg);}}
function validateLog(e){
  var errs={},warns=[];
  NUM_FIELDS.forEach(function(f){
    var val=e[f.k];
    if(val==null||val===''){if(f.req){errs[f.k]='Needed';}return;}
    if(val<f.min||val>f.max){errs[f.k]='Between '+f.min+' and '+f.max;}
  });
  if(!errs.w&&e.w!=null){
    var prior=Object.keys(state.weights).filter(function(k){return k<logDate;}).sort().slice(-7).map(function(k){return state.weights[k];});
    if(prior.length>=3){var a=avg(prior);if(Math.abs(e.w-a)>2){warns.push(e.w+' kg is '+Math.abs(e.w-a).toFixed(1)+' kg off your recent average of '+a.toFixed(1)+' kg.');}}
  }
  if(!errs.kcal&&!errs.p&&!errs.f&&!errs.c&&e.kcal!=null&&e.p!=null&&e.f!=null&&e.c!=null){
    var est=e.p*4+e.c*4+e.f*9;if(est>0&&Math.abs(e.kcal-est)>0.15*est){warns.push('Calories ('+fmt(e.kcal)+') don’t match your macros (about '+fmt(est)+' kcal).');}
  }
  var any=NUM_FIELDS.some(function(f){return e[f.k]!=null&&e[f.k]!=='';})||SCALES.some(function(x){return e[x[0]]!=null;})||e.off!=null||String(e.notes||'').trim();
  if(!any){errs._empty='Fill in at least one thing to save a log.';}
  return {errs:errs,warns:warns};
}
function logPayload(e){
  var out={};
  NUM_FIELDS.forEach(function(f){if(e[f.k]!=null&&e[f.k]!==''){out[f.k]=e[f.k];}});
  SCALES.forEach(function(x){if(e[x[0]]!=null){out[x[0]]=e[x[0]];}});
  if(e.off!=null){out.off=e.off;}
  if(String(e.notes||'').trim()){out.notes=String(e.notes).trim();}
  return out;
}
function commitLog(e){
  if(LIVE&&LOGLIVE){
    var btn=$('#savelog');if(btn){btn.disabled=true;btn.textContent='Saving…';}
    var d=logDate;
    api('log',{date:d,entry:logPayload(e)},30000).then(function(j){
      state.logs[d]=j.entry||logPayload(e);
      if(state.logs[d].w!=null){state.weights[d]=state.logs[d].w;}else{delete state.weights[d];}
      if(j.feedback){state.feedback[d]=j.feedback;}
      delete drafts[d];logSaved=d;warnShown=false;
      toast('Log saved');if(logDate===d){renderLog();}$('#main').scrollTop=0;
    },function(err){
      if(btn){btn.disabled=false;btn.textContent=state.logs[d]?'Update log':'Save log';}
      $('#warnbox').innerHTML='<div class="banner warn"><div><b>Not saved.</b> '+esc((err&&err.message)||'Something went wrong. Try again.')+'</div></div>';
    });
    return;
  }
  var out=Object.assign({},e);
  state.logs[logDate]=out;state.weights[logDate]=out.w;
  delete drafts[logDate];logSaved=logDate;warnShown=false;
  toast(LIVE?'Saved in preview only':'Log saved');renderLog();$('#main').scrollTop=0;
}
function wireLog(){
  var v=$('#view-log');
  $$('#datechips [data-date]',v).forEach(function(b){b.addEventListener('click',function(){logDate=b.dataset.date;logSaved=null;warnShown=false;renderLog();});});
  $('#pickdate').addEventListener('change',function(ev){if(ev.target.value){logDate=ev.target.value;logSaved=null;warnShown=false;renderLog();}});
  $$('input[data-k]',v).forEach(function(inp){inp.addEventListener('input',function(){
    var d=draftFor(logDate);d[inp.dataset.k]=num(inp.value);setFieldErr(inp.dataset.k,'');warnShown=false;$('#warnbox').innerHTML='';
    if(['p','f','c'].indexOf(inp.dataset.k)>-1){$('#macrohint').textContent=macroHint(d);}
  });});
  $('#f-notes').addEventListener('input',function(ev){draftFor(logDate).notes=ev.target.value;});
  $$('[data-scale]',v).forEach(function(b){b.addEventListener('click',function(){
    var d=draftFor(logDate),k=b.dataset.scale,val=Number(b.dataset.val);d[k]=d[k]===val?null:val;
    $$('[data-scale="'+k+'"]',v).forEach(function(x){x.classList.toggle('on',Number(x.dataset.val)===d[k]);});
  });});
  $$('[data-off]',v).forEach(function(b){b.addEventListener('click',function(){
    var d=draftFor(logDate);d.off=b.dataset.off==='1';
    $$('[data-off]',v).forEach(function(x){x.classList.toggle('on',(x.dataset.off==='1')===d.off);});
  });});
  $('#savelog').addEventListener('click',function(){
    var e=draftFor(logDate);
    var r=validateLog(e),keys=Object.keys(r.errs);
    NUM_FIELDS.forEach(function(f){setFieldErr(f.k,r.errs[f.k]);});
    if(r.errs._empty){$('#warnbox').innerHTML='<div class="banner warn"><div><b>'+esc(r.errs._empty)+'</b></div></div>';return;}
    if(keys.length){$('#warnbox').innerHTML='<div class="banner warn"><div><b>A few numbers look wrong.</b></div></div>';var el=$('#f-'+keys[0]);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.focus({preventScroll:true});}return;}
    if(r.warns.length&&!warnShown){
      warnShown=true;
      $('#warnbox').innerHTML='<div class="banner warn"><div><b>Worth a second look</b><ul>'+r.warns.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul><div class="row" style="margin-top:12px;justify-content:flex-start"><button class="btn ghost" type="button" id="fixit">Edit</button><button class="btn primary" type="button" id="forcesave">Save anyway</button></div></div></div>';
      $('#fixit').addEventListener('click',function(){warnShown=false;$('#warnbox').innerHTML='';$('#f-w').focus();});
      $('#forcesave').addEventListener('click',function(){commitLog(draftFor(logDate));});
      $('#warnbox').scrollIntoView({block:'center',behavior:'smooth'});
      return;
    }
    commitLog(e);
  });
}

/* ---------- TRAIN ---------- */
function inp(i){
  var ex=curSession().ex[i];
  if(!train.inputs[i]){train.inputs[i]={reps:Array(ex.sets).fill(''),load:ex.plan.load==null?'':String(ex.plan.load),fb:''};}
  return train.inputs[i];
}
function maxReps(ex){return Math.max(50,2*Math.max.apply(null,ex.plan.target));}
function rowState(i){
  var ex=curSession().ex[i],d=inp(i),max=maxReps(ex),invalid=null,complete=true;
  d.reps.forEach(function(r,k){
    if(r===''){complete=false;return;}
    var n=Number(r);
    if(isNaN(n)||n<0||n>max||Math.floor(n)!==n){invalid='Reps must be a whole number from 0 to '+max+'.';complete=false;}
  });
  if(d.load===''){if(ex.plan.load!=null&&ex.plan.load>0){complete=false;}}
  else if(isNaN(Number(d.load))||Number(d.load)<0){invalid=invalid||'Load must be 0 or more.';complete=false;}
  return {complete:complete,invalid:invalid};
}
function exCard(ex,i){
  var d=inp(i),max=maxReps(ex);
  var sets=d.reps.map(function(r,k){
    return '<label class="setf"><span>Set '+(k+1)+'</span><input type="number" inputmode="numeric" min="0" max="'+max+'" step="1" data-ex="'+i+'" data-set="'+k+'" value="'+esc(r)+'" placeholder="'+esc(ex.plan.target[k])+'" aria-label="'+esc(ex.name)+' set '+(k+1)+' reps"></label>';
  }).join('');
  var fb='';
  return '<article class="card ex" id="ex-'+i+'" data-ex="'+i+'">'+
    '<div class="ex-head"><span class="ex-n">'+(i+1)+'</span><h2>'+esc(ex.name)+'</h2>'+(ex.live?'':'<button class="demo" type="button" data-demo="'+i+'">'+ICON.play+'Demo</button>')+'</div>'+
    '<dl class="tl"><div class="tgt"><dt>Target</dt><dd>'+fmtPlan(ex.plan.target,ex.plan.load)+'</dd></div><div><dt>Last</dt><dd>'+(ex.live?esc(ex.lastText?ex.lastText.replace(/(\d+)\.0\b/g,'$1'):'First time'):fmtPlan(ex.last.reps,ex.last.load))+'</dd></div></dl>'+
    ((ex.rest||ex.tempo)?'<div class="tags">'+(ex.rest?'<span class="tag">Rest<b>'+esc(ex.rest)+'</b></span>':'')+(ex.tempo?'<span class="tag">Tempo<b>'+esc(ex.tempo)+'</b></span>':'')+'</div>':'')+(ex.note?'<div class="ex-note">'+esc(ex.note)+'</div>':'')+
    '<div class="sets'+(ex.sets>=5?' wrap':'')+'" style="--n:'+ex.sets+';--c:'+(ex.sets===5?3:4)+'">'+sets+'<label class="setf"><span>kg</span><input type="number" inputmode="decimal" step="0.5" min="0" data-ex="'+i+'" data-load="1" value="'+esc(d.load)+'" '+(ex.plan.load==null?'placeholder="BW"':'')+' aria-label="'+esc(ex.name)+' load in kilograms"></label></div>'+
    '<div class="err" id="err-'+i+'" role="alert"></div>'+
    '<div class="fb">'+fb+'<span class="rowstate" id="rs-'+i+'"></span></div></article>';
}
function renderTrain(){
  var v=$('#view-train');
  if(finished()){v.innerHTML=finishedCard();return;}
  var s=curSession();
  if(isHy(s)){renderHyrox(s);return;}
  v.innerHTML=
    '<div class="title"><div class="eyebrow">Session '+sessNo()+' of '+CFG.perCycle+' · Cycle '+cycleNo()+' of '+CFG.cycles+'</div><div class="h1">'+esc(s.name)+'</div><div class="facts meta">'+sessFacts(s)+'</div></div>'+
    weekChips()+
    '<p class="hint">Enter the reps you got for each set. Leave kg blank for bodyweight.</p>'+
    s.ex.map(exCard).join('')+
    '<div class="dock"><div class="row"><span id="dockcount"></span></div><button class="btn primary block" type="button" id="complete" disabled>Finish session</button></div>';
  wireTrain();
  s.ex.forEach(function(e,i){refreshRow(i);});
  refreshDock();
}
function refreshRow(i){
  var st=rowState(i),card=$('#ex-'+i);if(!card){return;}
  card.classList.toggle('done',st.complete);
  $('#rs-'+i).textContent=st.complete?'✓ Done':'';
  $('#err-'+i).textContent=st.invalid||'';
  $$('input',card).forEach(function(x){x.classList.toggle('bad',false);});
  if(st.invalid){
    var ex=curSession().ex[i],d=inp(i),max=maxReps(ex);
    $$('input[data-set]',card).forEach(function(x){var r=d.reps[Number(x.dataset.set)];if(r!==''){var n=Number(r);x.classList.toggle('bad',isNaN(n)||n<0||n>max||Math.floor(n)!==n);}});
    var l=$('input[data-load]',card);if(d.load!==''&&(isNaN(Number(d.load))||Number(d.load)<0)){l.classList.add('bad');}
  }
}
function refreshDock(){
  var s=curSession(),n=0,all,msg;
  if(isHy(s)){
    var tot=0;
    s.seg.forEach(function(g,i){var st=hyState(i);if(st.complete){n++;}if(st.secs!=null){tot+=st.secs;}});
    all=n===s.seg.length;
    msg=all?'All '+s.seg.length+' splits in · total '+fmtT(tot):n+' of '+s.seg.length+' splits in';
  }else{
    s.ex.forEach(function(e,i){if(rowState(i).complete){n++;}});
    all=n===s.ex.length&&s.ex.length>0;
    msg=all?'All '+s.ex.length+' exercises done':n+' of '+s.ex.length+' exercises done';
  }
  $('#dockcount').textContent=msg;
  $('#complete').disabled=!all;
}
function wireTrain(){
  var v=$('#view-train');
  $$('input[data-ex]',v).forEach(function(x){x.addEventListener('input',function(){
    var i=Number(x.dataset.ex),d=inp(i);
    if(x.dataset.load){d.load=x.value;}else{d.reps[Number(x.dataset.set)]=x.value;}
    refreshRow(i);refreshDock();
  });});
  $$('[data-fb]',v).forEach(function(b){b.addEventListener('click',function(){
    var i=Number(b.dataset.ex),d=inp(i);d.fb=d.fb===b.dataset.fb?'':b.dataset.fb;
    $$('[data-fb][data-ex="'+i+'"]',v).forEach(function(c){c.classList.toggle('on',c.dataset.fb===d.fb);});
  });});
  $$('[data-demo]',v).forEach(function(b){b.addEventListener('click',function(){toast('No demo video for this one yet.');});});
  $('#complete').addEventListener('click',openSummary);
}
function results(){
  return curSession().ex.map(function(ex,i){
    var d=inp(i),reps=d.reps.map(Number),load=d.load===''?null:Number(d.load);
    return {ex:ex,reps:reps,load:load,next:progress(ex,{reps:reps,load:load,target:ex.plan.target})};

function openSummary(){
  if(LIVE){openLiveSummary();return;}
  var s=curSession(),res=results();
  var rows=res.map(function(r){
    return '<div class="sum"><b>'+esc(r.ex.name)+'</b><span>Done '+fmtPlan(r.reps,r.load)+'</span><span class="nx">Next '+fmtPlan(r.next.target,r.next.load)+'</span><span class="why">'+esc(r.next.why)+'</span></div>';
  }).join('');

  openSheet('<div class="h2">Finish '+esc(s.name)+'?</div><div class="meta">Here’s what you did and what’s next. '+(completed+1>=TOTAL?'This finishes your block.':'Up next: '+esc(nxt)+'.')+'</div>'+rows+
    '<button class="btn primary block" type="button" id="confirmdone">Save session</button><button class="btn ghost block" type="button" id="backto">Back</button>');
  $('#backto').addEventListener('click',closeSheet);

    var res2=results(),name=s.name,progressed=res2.filter(function(r){return r.next.kind==='load'||r.next.kind==='rep';}).length;

    state.history.push({date:todayIso,name:name,note:progressed+' of '+res2.length+' progressed'});
    completed++;train.inputs={};train.fb='';

  });

/* ---------- TRAIN: timed (Hyrox style) ---------- */
function hin(i){
  if(!train.inputs[i]){var g=curSession().seg[i];train.inputs[i]={t:'',load:g.loadKg==null?'':String(g.plan.load),touched:false};}
  return train.inputs[i];
}
function hyState(i){
  var g=curSession().seg[i],d=hin(i),p=parseT(d.t),o={complete:true,invalid:null,warn:null,badTime:false,badLoad:false,secs:null};
  if(!p){o.complete=false;}
  else if(p.sec>59){o.invalid='Seconds must be 00 to 59.';o.badTime=true;o.complete=false;}
  else if(p.total<10||p.total>3600){o.invalid='Enter a time between 0:10 and 60:00.';o.badTime=true;o.complete=false;}
  else{
    o.secs=p.total;var r=p.total/g.plan.tgt;
    if(r<0.6||r>1.6){o.warn='Far from your '+fmtT(g.plan.tgt)+' target. Check the time before you log it.';}
  }
  if(g.loadKg!=null){
    if(d.load===''){o.complete=false;}
    else if(isNaN(Number(d.load))||Number(d.load)<0){o.invalid=o.invalid||'Load must be 0 or more.';o.badLoad=true;o.complete=false;}
  }
  return o;
}
function hyRow(g,i){
  var d=hin(i),stn=g.kind==='stn',sub2='';
  if(stn){
    sub2='<div class="hy-sub2">'+(g.loadKg!=null?'<label class="hy-load"><span>'+esc(g.loadLabel)+'</span><input type="number" inputmode="decimal" step="0.5" min="0" data-hy="'+i+'" data-load="1" value="'+esc(d.load)+'" aria-label="'+esc(g.name)+' load in kilograms"></label>':'<span class="hy-load"></span>')+
      '<button class="demo" type="button" data-demo="'+i+'">'+ICON.play+'Demo</button></div>';
  }
  return '<div class="hy-row'+(stn?' stn':'')+'" id="hy-'+i+'">'+
    '<div class="hy-main"><span class="hy-tag">'+(stn?'STATION':'RUN')+'</span><div class="hy-name"><b>'+esc(g.name)+'</b><span>'+esc(g.dist)+'</span></div>'+
    '<div class="hy-time"><input type="text" inputmode="numeric" autocomplete="off" placeholder="m:ss" data-hy="'+i+'" data-time="1" value="'+esc(d.t)+'" aria-label="'+esc(g.name)+' time in minutes and seconds"></div></div>'+
    '<div class="hy-sub">Target <b>'+fmtT(g.plan.tgt)+'</b> · Last '+fmtT(g.last.sec)+(g.loadKg!=null&&g.last.load!=null?' @ '+g.last.load+' kg':'')+'</div>'+
    (g.note?'<div class="ex-note hy-note">'+esc(g.note)+'</div>':'')+sub2+
    '<div class="err" id="hye-'+i+'" role="alert"></div><div class="hy-warn" id="hyw-'+i+'"></div></div>';
}
function renderHyrox(s){
  var v=$('#view-train');
  var tgt=s.seg.reduce(function(a,g){return a+g.plan.tgt;},0),last=s.seg.reduce(function(a,g){return a+g.last.sec;},0);
  var fb=['Easy','Good','Hard'].map(function(f){return '<button type="button" class="chip'+(train.fb===f?' on':'')+'" data-hyfb="'+f+'">'+f+'</button>';}).join('');
  v.innerHTML=
    '<div class="title"><div class="eyebrow">Session '+sessNo()+' of '+CFG.perCycle+' · Cycle '+cycleNo()+' of '+CFG.cycles+'</div><div class="h1">'+esc(s.name)+'</div><div class="facts meta"><span>'+esc(s.format)+'</span>'+sessFacts(s,true)+'</div></div>'+
    weekChips()+
    '<div class="macros4" style="grid-template-columns:1fr 1fr"><div><span class="eyebrow">Target</span><span class="num" style="color:var(--plate)">'+fmtT(tgt)+'</span></div><div><span class="eyebrow">Last time</span><span class="num">'+fmtT(last)+'</span></div></div>'+
    '<p class="hint">'+esc(s.blurb)+' Type times as digits: 542 is 5:42.</p>'+
    '<div class="card hy">'+s.seg.map(hyRow).join('')+'</div>'+

function refreshHy(i){

function wireHyrox(){

    '<button class="btn primary block" type="button" id="confirmdone">Save session</button><button class="btn ghost block" type="button" id="backto">Back</button>');

/* Every meal the diet allows, grouped by meal type; best matches first. */
function mealGroups(n){
  if(n.library&&n.library.length){return n.library;}
  var by={},order=[];
  (n.slots||[]).forEach(function(sl){
    if(!by[sl.type]){by[sl.type]=[];order.push(sl.type);}
    sl.options.forEach(function(o){by[sl.type].push({name:o.name,diet:o.diet,prep:o.prep,tags:o.tags,ingredients:o.ingredients,best:true,bestPortion:o.portion,portions:[{id:o.id||o.name,portion:o.portion||'Standard',calories:o.calories,protein:o.protein,carbs:o.carbs,fat:o.fat,amounts:o.amounts||[]}]});});
  });
  return order.map(function(t){return {type:t,meals:by[t]};});
}
function pickedPortion(gi,mi,m){
  var k=gi+'|'+mi,want=mealPick[k];
  var ps=m.portions.slice().sort(function(a,b){return (a.calories||0)-(b.calories||0);});
  var hit=ps.filter(function(x){return x.portion===want;})[0];
  if(!hit&&m.bestPortion){hit=ps.filter(function(x){return x.portion===m.bestPortion;})[0];}
  if(!hit){hit=ps.filter(function(x){return x.portion==='Standard';})[0];}
  return {list:ps,cur:hit||ps[Math.floor(ps.length/2)]};
}
function mealCard(gi,mi,m,open){

  var macros='<div class="macros"><b>'+fv(o.calories)+'</b><span>kcal</span><span class="mx"><i>P</i>'+fv(o.protein)+'g</span><span class="mx"><i>C</i>'+fv(o.carbs)+'g</span><span class="mx"><i>F</i>'+fv(o.fat)+'g</span></div>';
  var meta=[m.prep,m.diet].filter(Boolean).map(esc).join(' · ');
  var ptns=pp.list.length>1?'<div class="ptns" role="group" aria-label="Portion size">'+pp.list.map(function(x){return '<button class="ptn'+(x===o?' on':'')+'" type="button" data-g="'+gi+'" data-m="'+mi+'" data-p="'+esc(x.portion)+'" aria-pressed="'+(x===o)+'">'+esc(x.portion)+'</button>';}).join('')+'</div>':'';
  var amts=(o.amounts&&o.amounts.length)?'<details class="amts"'+(open?' open':'')+'><summary>Amounts</summary><ul>'+o.amounts.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul></details>':'';
  return '<article class="card meal" data-card="'+gi+'|'+mi+'"><div class="row"><h3>'+esc(m.name)+'</h3>'+(m.best?'<span class="pill good">Best fit</span>':'')+'</div>'+macros+(meta?'<div class="meta">'+meta+'</div>':'')+ptns+amts+'</article>';

function chartSVG(){
  var pts=Object.keys(state.weights).sort().map(function(k){return {d:fromIso(k),kg:state.weights[k]};});
  var wk=weeklyRows();
  var W=340,H=196,L=38,R=12,Tp=14,B=28;
  var kgs=pts.map(function(p){return p.kg;});
  var lo=Math.floor(Math.min.apply(null,kgs)*2)/2-0.5,hi=Math.ceil(Math.max.apply(null,kgs)*2)/2+0.5;
  var span=20;
  var X=function(day){return L+(day/span)*(W-L-R);};
  var Y=function(kg){return Tp+(hi-kg)/(hi-lo)*(H-Tp-B);};
  var dayIdx=function(d){return Math.round((d-startMonday)/864e5);};
  var grid='';
  [hi,(hi+lo)/2,lo].forEach(function(g){grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="11" style="fill:var(--mute)">'+g.toFixed(1)+'</text>';});
  var xl='';[['Week 1',3],['Week 2',10],['Week 3',17]].forEach(function(w){xl+='<text x="'+X(w[1])+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" style="fill:var(--mute)">'+w[0]+'</text>';});
  var dots=pts.map(function(p){return '<circle cx="'+X(dayIdx(p.d)).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="3" style="fill:var(--mute)" opacity=".65"/>';}).join('');
  var line=wk.map(function(r){return [X((r.week-1)*7+3),Y(r.avg)];});

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bodyweight by day with weekly averages">'+grid+xl+dots+(line.length>1?'<polyline points="'+path+'" fill="none" style="stroke:var(--plate)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>':'')+marks+'</svg>';

/* ---------- progress charts (live) ---------- */
/* Bodyweight and steps come from the client's own daily log; lifts come
   from their session history via the engine's "trends" action. */
var liftSel='';
function svgLine(pts,o){
  // pts: [{t:ms,y:number}] sorted; o: {avg:[{t,y}], target:number, unit:'', dp:1, label:''}
  o=o||{};var W=340,H=180,L=40,R=12,Tp=12,B=26;
  var ys=pts.map(function(p){return p.y;}).concat(o.avg?o.avg.map(function(p){return p.y;}):[]);
  if(o.target!=null){ys.push(o.target);}
  var lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  var pad=Math.max((hi-lo)*0.12,o.minPad||1);lo-=pad;hi+=pad;
  var t0=pts[0].t,t1=pts[pts.length-1].t;if(t1===t0){t0-=864e5;t1+=864e5;}
  var X=function(t){return L+(t-t0)/(t1-t0)*(W-L-R);};
  var Y=function(y){return Tp+(hi-y)/(hi-lo)*(H-Tp-B);};
  var dp=o.dp==null?1:o.dp,g='';
  [hi,(hi+lo)/2,lo].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" style="fill:var(--mute)">'+fmt(v,dp)+'</text>';});
  var xl=[t0,t1].map(function(t,i){var d=new Date(t);return '<text x="'+X(t).toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+(i?'end':'start')+'" font-size="11" style="fill:var(--mute)">'+d.getDate()+' '+MONTHS[d.getMonth()]+'</text>';}).join('');
  var tg=o.target!=null?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.target).toFixed(1)+'" y2="'+Y(o.target).toFixed(1)+'" style="stroke:var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>':'';
  var line=function(a,w,col){return a.length>1?'<polyline points="'+a.map(function(p){return X(p.t).toFixed(1)+','+Y(p.y).toFixed(1);}).join(' ')+'" fill="none" style="stroke:'+col+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"/>':'';};
  var dots=pts.map(function(p,i){var last=i===pts.length-1&&!o.avg;return '<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(o.avg?3:last?5.5:3.5)+'" style="fill:'+(o.avg?'var(--mute)':'var(--plate)')+(last?';stroke:var(--ink)':'')+'"'+(o.avg?' opacity=".6"':'')+' stroke-width="2"/>';}).join('');
  var main=o.avg?line(o.avg,2.5,'var(--plate)'):line(pts,2.5,'var(--plate)');
  var endDot=o.avg&&o.avg.length?(function(p){return '<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="5.5" style="fill:var(--plate);stroke:var(--ink)" stroke-width="2"/>';})(o.avg[o.avg.length-1]):'';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">'+g+tg+xl+(o.avg?dots+main:main+dots)+endDot+'</svg>';
}
function svgBars(rows,target){
  // rows: [{label, v}] oldest first
  var W=340,H=170,L=40,R=12,Tp=12,B=26;
  var vals=rows.map(function(r){return r.v||0;});if(target){vals.push(target);}
  var hi=Math.max.apply(null,vals.concat([1]))*1.12;
  var Y=function(v){return Tp+(hi-v)/hi*(H-Tp-B);};
  var bw=(W-L-R)/rows.length,g='';
  [hi,hi/2].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" style="fill:var(--mute)">'+(v>=1000?fmt(v/1000,1)+'k':fmt(v))+'</text>';});
  var bars=rows.map(function(r,i){
    var x=L+i*bw+bw*0.18,w=bw*0.64,last=i===rows.length-1;
    var lab='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" style="fill:var(--mute)">'+esc(r.label)+'</text>';
    if(r.v==null){return lab;}
    var hit=target&&r.v>=target;
    return '<rect x="'+x.toFixed(1)+'" y="'+Y(r.v).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(Y(0)-Y(r.v)).toFixed(1)+'" rx="3" style="fill:'+(hit?'var(--good)':'var(--plate)')+'"'+(last?'':' opacity=".75"')+'/>'+lab;
  }).join('');
  var tg=target?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(target).toFixed(1)+'" y2="'+Y(target).toFixed(1)+'" style="stroke:var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/>':'';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Average daily steps by week">'+g+bars+tg+'</svg>';
}
function weightCard(){
  var tr=state.trends||{},st=tr.start||{};
  var pts=Object.keys(state.weights).sort().map(function(k){return {t:fromIso(k).getTime(),y:Number(state.weights[k]),d:k};});
  if(st.w&&st.date&&(!pts.length||st.date<pts[0].d)){pts.unshift({t:fromIso(st.date).getTime(),y:Number(st.w),d:st.date,start:true});}
  if(pts.length<2){
    return '<div class="card"><div class="eyebrow">Bodyweight</div>'+(st.w?'<div class="row"><span class="num">'+kg(st.w)+'<small>kg at the start</small></span></div>':'')+
      '<div class="hint">Log your bodyweight on the Log tab and your trend will build up here. A few weigh-ins a week is plenty.</div></div>';
  }
  // 7-day rolling average of the weigh-ins (the start weight counts as its own point)
  var avgPts=pts.map(function(p){var w=pts.filter(function(q){return q.t<=p.t&&q.t>p.t-7*864e5;});return {t:p.t,y:avg(w.map(function(q){return q.y;}))};});
  var first=pts[0],now=avgPts[avgPts.length-1].y,chg=now-first.y;
  return '<div class="card"><div class="eyebrow">Bodyweight</div>'+
    '<div class="tiles"><div class="tile"><div class="eyebrow">'+(first.start?'Start':fmtDate(new Date(first.t)))+'</div><div class="num">'+fmt(first.y,1)+'<small>kg</small></div></div>'+
    '<div class="tile"><div class="eyebrow">Now (avg)</div><div class="num">'+fmt(now,1)+'<small>kg</small></div></div>'+
    '<div class="tile"><div class="eyebrow">Change</div><div class="num '+(chg>0?'up':'down')+'">'+signed(chg)+'<small>kg</small></div></div></div>'+
    svgLine(pts,{avg:avgPts,dp:1,minPad:0.5,label:'Bodyweight over time with 7-day average'})+
    '<div class="hint">Dots are your weigh-ins. The line is your 7-day average, which is the number to watch: daily weight jumps around.</div></div>';
}
function stepsCard(){
  var tgt=(state.trends&&state.trends.stepsTarget)||null,rows=[],any=false;
  for(var i=7;i>=0;i--){
    var mon=addDays(monday,-7*i),vals=[];
    for(var j=0;j<7;j++){var k=iso(addDays(mon,j));var e=state.logs[k];if(e&&e.steps!=null){vals.push(Number(e.steps));}}
    if(vals.length){any=true;}
    rows.push({label:mon.getDate()+' '+MONTHS[mon.getMonth()],v:vals.length?Math.round(avg(vals)):null,n:vals.length});
  }
  if(!any){return '';}
  var cur=rows[rows.length-1];
  return '<div class="card"><div class="eyebrow">Steps · daily average by week</div>'+
    '<div class="row"><span class="num">'+(cur.v!=null?fmt(cur.v):'–')+'<small>this week</small></span>'+(tgt?'<span class="meta">Target '+fmt(tgt)+'</span>':'')+'</div>'+
    svgBars(rows,tgt)+'<div class="hint">Each bar is the average of the days you logged that week'+(tgt?'. Green bars hit your target (the dashed line).':'.')+'</div></div>';
}
function liftCard(){
  var lifts=((state.trends&&state.trends.lifts)||[]).filter(function(l){return l.points.length>=2;});
  if(!lifts.length){
    var some=state.trends&&state.trends.lifts&&state.trends.lifts.length;
    return some?'<div class="card"><div class="eyebrow">Lifts</div><div class="hint">Your strength charts appear once you’ve done a lift in two sessions.</div></div>':'';
  }
  var cur=lifts.filter(function(l){return l.exercise===liftSel;})[0]||lifts[0];liftSel=cur.exercise;
  var p=cur.points,first=p[0],last=p[p.length-1],best=Math.max.apply(null,p.map(function(x){return x.v;}));
  var load=cur.kind==='load',d=last.v-first.v;
  var head=load?'<span class="num">'+kg(last.v)+'<small>kg est. 1RM</small></span>':'<span class="num">'+last.v+'<small>reps</small></span>';
  var chg=d===0?'Same as '+fmtDate(fromIso(first.d)):(d>0?'+':'−')+(load?kg(Math.abs(d))+' kg':Math.abs(d)+' reps')+' since '+fmtDate(fromIso(first.d));
  var chips=lifts.map(function(l){return '<button class="chip'+(l===cur?' on':'')+'" type="button" data-lift="'+esc(l.exercise)+'" aria-pressed="'+(l===cur)+'">'+esc(nice(l.exercise))+'</button>';}).join('');
  return '<div class="card"><div class="eyebrow">Lifts · '+(load?'estimated 1-rep max':'most reps in a set')+'</div>'+
    '<div class="chips liftpick" role="group" aria-label="Pick a lift">'+chips+'</div>'+
    '<div class="row">'+head+'<span class="meta '+(d>0?'gain':'')+'">'+esc(chg)+'</span></div>'+
    svgLine(p.map(function(x){return {t:fromIso(x.d).getTime(),y:x.v};}),{dp:load?0:0,minPad:load?2.5:1,label:nice(cur.exercise)+' over time'})+
    '<div class="hint">Last time: '+(load?kg(last.load)+' kg × '+last.reps:last.reps+' reps')+', '+fmtDate(fromIso(last.d))+'. '+
    (load?'Est. 1RM turns your best set into one number, so heavier and more reps both count. Best so far '+kg(best)+' kg.':'Best so far '+best+' reps.')+'</div></div>';
}
function trendsSection(){
  var html=weightCard()+stepsCard()+liftCard();
  return html?'<div class="eyebrow" style="margin-top:4px">Trends</div>'+html:'';
}
var pbAll=false;
function pbSection(){
  if(!state.pbs){return '';}
  if(!state.pbs.length){return '<div class="card"><div class="eyebrow">Personal bests</div><div class="meta">Your bests will build up here as you train.</div></div>';}
  var list=state.pbs.slice().sort(function(a,b){
    var da=[a.heaviest&&a.heaviest.date,a.reps&&a.reps.date].filter(Boolean).sort().pop()||'';
    var db=[b.heaviest&&b.heaviest.date,b.reps&&b.reps.date].filter(Boolean).sort().pop()||'';
    return db<da?-1:db>da?1:0;
  });
  var shown=pbAll?list:list.slice(0,8);
  var rows=shown.map(function(p){
    var main='',sub='',when='';
    if(p.heaviest){main=fmt(p.heaviest.load)+' kg <span class="meta">× '+p.heaviest.reps+'</span>';when=p.heaviest.date;
      if(p.e1rm){sub='Est. 1RM '+fmt(p.e1rm.value)+' kg';}}
    else if(p.reps){main=p.reps.reps+' <span class="meta">reps</span>';when=p.reps.date;sub='Bodyweight';}
    return '<div class="pbrow"><div><b>'+esc(nice(p.exercise))+'</b><span class="meta">'+esc(sub)+(when?(sub?' · ':'')+fmtDate(fromIso(when)):'')+'</span></div><div class="pbv">'+main+'</div></div>';
  }).join('');
  return '<div class="eyebrow" style="margin-top:4px">Personal bests</div><div class="card pbs">'+rows+
    (list.length>shown.length?'<button class="btn ghost block" type="button" id="pbmore">Show all '+list.length+'</button>':'')+'</div>';
}

/* ---------- coach mode ---------- */
/* One private link (?coach=KEY) lists every active client. Pick one to log
   their session, check their log or look at their bests. */
function getCoachKey(){
  var q=null,k='';
  try{q=new URLSearchParams(location.search);}catch(e){}
  if(q&&q.get('coach')){k=q.get('coach');try{localStorage.setItem('ts_coach',k);}catch(e){}return k;}
  if(q&&q.get('t')){return '';}
  try{k=localStorage.getItem('ts_coach')||'';}catch(e){}
  return k;
}
function coachRecent(){try{return JSON.parse(localStorage.getItem('ts_coach_recent')||'[]');}catch(e){return [];}}
function stClass(t){
  if(/^Gone quiet/i.test(t)){return 'bad';}
  if(/^Payment overdue/i.test(t)){return 'bad';}
  if(/^(No daily log|Missed|Payment)/i.test(t)){return 'warn';}
  if(/^(Flying|Sent|On track)/i.test(t)){return 'good';}
  if(/^New/i.test(t)){return 'new';}
  return '';
}
function shortStatus(t){return String(t||'').replace(/:.*$/,'');}
function openCoach(){
  COACHMODE=true;BOOT='coach';LIVE=false;TOKEN='';coachName='';
  if(location.hash){history.replaceState(null,'',location.pathname+location.search);}
  route();
  apiCall({action:'coach_clients',coach:COACH},25000).then(function(j){
    if(!j||!j.ok){coachErr=(j&&j.message)||'This coach link is not recognised.';coachList=null;}
    else{coachErr='';coachList=j.clients||[];}
    if(BOOT==='coach'){renderCoach();}
  },function(e){coachErr=(e&&e.message)||'Couldn’t connect.';if(BOOT==='coach'){renderCoach();}});
}
function renderCoach(){
  var v=$('#view-home');
  if(coachErr){
    v.innerHTML='<div class="card quiet"><div class="eyebrow">Coach</div><div class="h1">Couldn’t load clients</div><div class="meta">'+esc(coachErr)+'</div><button class="btn primary block" type="button" id="coachretry">Try again</button></div>';
    $('#coachretry').addEventListener('click',openCoach);return;
  }
  if(!coachList){v.innerHTML='<div class="card quiet"><div class="eyebrow">Coach</div><div class="h1">Loading clients</div><div class="bar"><i class="load"></i></div></div>';return;}
  var q=coachQuery.trim().toLowerCase();
  var list=coachList.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0;});
  var row=function(c){
    var lt=String(c.lastTrained||'');var meta=[lt&&lt!=='never'?'Last trained '+lt:'Not trained yet',c.block].filter(Boolean).join(' · ');
    return '<button class="crow" type="button" data-tok="'+esc(c.token)+'"><span><b>'+esc(c.name)+'</b><span class="meta">'+esc(meta||'No sessions yet')+'</span></span>'+
      (c.status?'<span class="st '+stClass(c.status)+'">'+esc(shortStatus(c.status))+'</span>':'')+'</button>';
  };
  var real=list.filter(function(c){return !c.test;}),tests=list.filter(function(c){return c.test;});
  var rec=q?[]:coachRecent().filter(function(r){return coachList.some(function(c){return c.token===r.token;});}).slice(0,4);
  v.innerHTML='<div class="title"><div class="eyebrow">Coach</div><div class="h1">Your clients</div></div>'+
    '<input class="csearch" id="csearch" type="search" placeholder="Find a client" autocomplete="off" value="'+esc(coachQuery)+'">'+
    (rec.length?'<div class="eyebrow">Recent</div><div class="recent">'+rec.map(function(r){return '<button class="chip" type="button" data-tok="'+esc(r.token)+'">'+esc(r.name)+'</button>';}).join('')+'</div>':'')+
    '<div class="eyebrow">'+real.length+' active client'+(real.length===1?'':'s')+'</div><div class="clist">'+(real.map(row).join('')||'<div class="meta">No clients match.</div>')+'</div>'+
    (tests.length?'<div class="eyebrow">Test clients</div><div class="clist">'+tests.map(row).join('')+'</div>':'');
  var s=$('#csearch');
  s.addEventListener('input',function(){coachQuery=s.value;var pos=s.selectionStart;renderCoach();var n=$('#csearch');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}});
  $$('[data-tok]',v).forEach(function(b){b.addEventListener('click',function(){
    var c=coachList.filter(function(x){return x.token===b.dataset.tok;})[0];if(c){pickClient(c);}
  });});
}
function pickClient(c){
  var rec=coachRecent().filter(function(r){return r.token!==c.token;});
  rec.unshift({token:c.token,name:c.name});
  try{localStorage.setItem('ts_coach_recent',JSON.stringify(rec.slice(0,6)));}catch(e){}
  TOKEN=c.token;coachName=c.name;
  LIVE=false;LOGLIVE=false;nut=null;nutFail=null;mealPick={};mealSlot=0;
  state.weights={};state.logs={};state.feedback={};state.pbs=null;state.trends=null;state.history=[];liftSel='';
  train.inputs={};drafts={};logDate=todayIso;logSaved=null;
  live.state=null;live.names=[];live.cur=null;live.key='';
  TESTTABS={};CLIENTTABS={};pbAll=false;
  location.hash='#train';
  startLive();
}

/* ---------- routing ---------- */
var VIEWS=['home','log','train','meals','checkin','progress'];
var RENDER={home:renderHome,log:renderLog,train:renderTrain,meals:renderMeals,checkin:renderCheckin,progress:function(){if(LIVE){renderProgressLive();}else{renderProgress();}}};
function route(){
  if(BOOT==='coach'){
    closeSheet();setPill();$('#nav').hidden=true;
    VIEWS.forEach(function(n){$('#view-'+n).hidden=n!=='home';});
    renderCoach();return;
  }
  var h=(location.hash||'#home').slice(1);
  if(VIEWS.indexOf(h)<0||!tabOn(h)){h='home';}
  if(BOOT==='loading'||BOOT==='error'){
    closeSheet();setPill();$('#nav').hidden=true;
    VIEWS.forEach(function(n){$('#view-'+n).hidden=n!=='home';});
    $$('#nav a').forEach(function(a){a.classList.remove('on');a.removeAttribute('aria-current');});
    $('#view-home').innerHTML=bootHtml();wireBoot();return;
  }
  closeSheet();setPill();$('#nav').hidden=false;
  VIEWS.forEach(function(n){$('#view-'+n).hidden=n!==h;});
  $$('#nav a').forEach(function(a){var on=a.dataset.tab===h;a.classList.toggle('on',on);if(on){a.setAttribute('aria-current','page');}else{a.removeAttribute('aria-current');}});
  RENDER[h]();
  $('#main').scrollTop=0;
}
document.addEventListener('click',function(ev){
  var g=ev.target.closest('[data-go]');
  if(g){location.hash=g.dataset.go;}
});
window.addEventListener('hashchange',route);
COACH=CFG.api?getCoachKey():'';
$('#coachswitch').addEventListener('click',function(){coachQuery='';openCoach();});
if(COACH){openCoach();}
else{TOKEN=getToken();loadTestTabs();}
if(COACH){/* coach mode */}
else if(CFG.api&&TOKEN){startLive();}
else if(CFG.api){BOOT='error';BOOTNORETRY=true;BOOTERR='This link isn’t complete. Open the full link '+CFG.coach+' sent you.';route();}
else{route();}
})();
</script>
